@let d = drill();

<!-- Top: name, basic info and the edit and close buttons -->
<article class="card shadow-sm detail-hero" aria-labelledby="detail-title">
  <div class="detail-heading">
    <span class="detail-meta">{{ d.players }} players · {{ d.space }}</span>
    <h2 id="detail-title" class="detail-name mb-0"><span class="slanted">{{ d.name }}</span></h2>
  </div>

  <div class="detail-actions">
    <button type="button" class="btn btn-outline-eagles btn-touch" (click)="edit.emit()">
      <i class="bi bi-pencil-square me-1" aria-hidden="true"></i>Edit
    </button>
    <button type="button" class="btn btn-touch detail-close" aria-label="Close drill" (click)="closed.emit()">
      <i class="bi bi-x-lg" aria-hidden="true"></i>
    </button>
  </div>
</article>

@if (d.animationUrl) {
  <app-animation [src]="d.animationUrl" [label]="'3D animation of ' + d.name" />
}

<!-- Image, video and animation: only the ones the drill has are shown -->
@if (d.image && brokenImage() !== d.image) {
  <img
    class="detail-image"
    [src]="d.image"
    [alt]="'Diagram of ' + d.name"
    loading="lazy"
    (error)="brokenImage.set(d.image!)"
  />
}

@if (d.video) {
  <app-media [src]="d.video" [label]="'Video of ' + d.name" />
}

<!-- Drill sheet: objective, description and the rest of the data in one card -->
<app-sheet [drill]="d" [canDelete]="true" (deleted)="deleted.emit()" />
