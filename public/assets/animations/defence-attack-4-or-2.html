<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: escenario 3D grande a la izquierda + ficha técnica a la derecha; se apila en móvil */
:root{
  --bg:#EDF2F6; --panel:#FFFFFF; --ink:#15202B; --muted:#5A6A79; --line:#D3DDE6;
  --stage:#E2EBF2; --court:#EE7A35; --sky:#49A7DD; --red:#E4473B; --gold:#F2B630; --pale:#9FD6F3; --coach:#2A3542;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151C; --panel:#151F29; --ink:#E7EDF2; --muted:#93A2B0; --line:#26323E; --stage:#111A23; color-scheme:dark }}
:root[data-theme="dark"]{ --bg:#0E151C; --panel:#151F29; --ink:#E7EDF2; --muted:#93A2B0; --line:#26323E; --stage:#111A23; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:1440px;margin:0 auto;padding-block:18px 28px;padding-inline:16px;display:flex;flex-direction:column;gap:16px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 24px}
.eyebrow{margin:0;font:600 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--court)}
h1{margin:4px 0 0;font:700 clamp(28px,4vw,40px)/1 var(--display);letter-spacing:.01em;text-wrap:balance;text-transform:uppercase}
.meta{color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
@media (max-width:920px){.layout{grid-template-columns:minmax(0,1fr)}}

.stage-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.stage{position:relative;height:clamp(340px,64vh,720px);background:var(--stage)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.caption{position:absolute;left:12px;top:12px;max-width:min(440px,calc(100% - 24px));background:color-mix(in srgb,var(--panel) 90%,transparent);border:1px solid var(--line);border-radius:10px;padding:10px 12px;pointer-events:none;backdrop-filter:blur(6px);transform:scale(.65);transform-origin:top left}
.caption .step{font:600 11px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.caption .main{margin:5px 0 0;font:700 21px/1.1 var(--display);text-transform:uppercase;letter-spacing:.01em}
.caption .sub{margin:4px 0 0;font-size:13px;color:var(--muted)}
.caption .sub:empty{display:none}
.cams{position:absolute;right:12px;top:12px;display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;max-width:50%}
@media (max-width:560px){.cams{top:auto;bottom:12px;max-width:none}}
.vars{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 24px);z-index:5}
.layout.nosheet{grid-template-columns:minmax(0,1fr)}
.chip{font:600 12px/1 var(--body);letter-spacing:.04em;padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible,input:focus-visible{outline:2px solid var(--court);outline-offset:2px}

.controls{display:flex;flex-direction:column;gap:12px;padding:12px 14px 14px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.transport{display:flex;gap:6px;align-items:center}
.btn{display:inline-grid;place-items:center;height:38px;min-width:38px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;font:600 13px var(--body)}
.btn.play{background:var(--court);border-color:var(--court);color:#fff;min-width:48px}
.btn svg{width:18px;height:18px;fill:currentColor}
.time{font:600 13px var(--body);font-variant-numeric:tabular-nums;color:var(--muted);min-width:92px}
.group{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.group .lbl{font:600 11px var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.spacer{flex:1}
.timeline{position:relative;padding-top:10px}
.ticks{position:absolute;left:8px;right:8px;top:0;height:8px}
.ticks i{position:absolute;top:0;width:2px;height:8px;border-radius:1px;transform:translateX(-1px)}
input[type=range]{width:100%;accent-color:var(--court);margin:0}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{margin:0;font:700 18px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.panel h3{margin:0 0 6px;font:600 11px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.legend div{display:flex;gap:8px;align-items:center;font-size:13px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:5px;font-size:14px}
ol li::marker{font-weight:700;color:var(--court)}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:14px}
dt{color:var(--muted)} dd{margin:0}
.note{font-size:13px;color:var(--muted);margin:0}
.reseed{align-self:flex-start}
.cfg{display:flex;flex-direction:column;gap:8px}
.cfg .lbl{min-width:76px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>

<div class="app">

            <button class="btn play" id="play" title="Play / pause (space)" aria-label="Pause"><svg viewBox="0 0 24 24" id="playIcon"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
            <button class="btn" id="next" title="Next action (→)" aria-label="Next action"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- Colores de escena (estilo de la referencia) ---------- */
const C={court:'#EE7A35',sky:'#49A7DD',skySide:'#2D7DB2',line:'#FFFFFF',
  pale:'#9FD6F3',red:'#E4473B',gold:'#F2B630',coach:'#2A3542',
  skin:'#F2C49C',hair:'#3B2A21',shorts:'#1C232C',shoe:'#F4F6F8',net:'#1E2732'};

/* ---------- Render ---------- */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-10,10,10,-10,0.1,300);
const controls=new THREE.OrbitControls(cam,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.495;controls.minZoom=0.6;controls.maxZoom=5;
controls.target.set(0,0.6,0);

function setBg(){scene.background=new THREE.Color(css('--stage')||'#E2EBF2');}
setBg();
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',setBg);
new MutationObserver(setBg).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

scene.add(new THREE.HemisphereLight(0xffffff,0x9fb3c4,0.9));
const sun=new THREE.DirectionalLight(0xffffff,0.65);sun.position.set(-6,14,9);scene.add(sun);

const matCache={};
const mat=c=>matCache[c]||(matCache[c]=new THREE.MeshStandardMaterial({color:c,roughness:.85,metalness:0}));
const basic=(c,o=1)=>new THREE.MeshBasicMaterial({color:c,transparent:o<1,opacity:o,depthWrite:o>=1});
const cyl=(r1,r2,h,m,seg=14)=>new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);
const box=(w,h,d,m)=>new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);

/* ---------- Pista ---------- */
const slab=new THREE.Mesh(new THREE.BoxGeometry(27,0.4,15),
  [mat(C.skySide),mat(C.skySide),mat(C.sky),mat(C.skySide),mat(C.skySide),mat(C.skySide)]);
slab.position.y=-0.2;scene.add(slab);
const court=new THREE.Mesh(new THREE.PlaneGeometry(18,9),mat(C.court));
court.rotation.x=-Math.PI/2;court.position.y=0.002;scene.add(court);
const lineM=basic(C.line);
function addLine(x,z,w,d){const m=new THREE.Mesh(new THREE.BoxGeometry(w,0.004,d),lineM);m.position.set(x,0.005,z);scene.add(m);}
addLine(0,4.475,18,0.05);addLine(0,-4.475,18,0.05);
addLine(8.975,0,0.05,9);addLine(-8.975,0,0.05,9);
addLine(0,0,0.05,9);addLine(3,0,0.05,9);addLine(-3,0,0.05,9);
for(const x of [3,-3])for(const s of [1,-1])for(let i=0;i<5;i++)addLine(x,s*(4.5+0.25+i*0.35),0.05,0.15);

function textTex(txt,size,color,w=256,h=256,weight=700){
  const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');
  g.fillStyle=color;g.font=`${weight} ${size}px "Barlow Condensed","Arial Narrow",sans-serif`;
  g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,h/2+size*0.05);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;
}
function floorText(txt,x,z,w,h,size,opacity,cw=256,ch=256){
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:textTex(txt,size,'#ffffff',cw,ch),transparent:true,opacity,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x,0.008,z);scene.add(m);return m;
}

/* ---------- Red ---------- */
const net=new THREE.Group();scene.add(net);
for(const z of [-5.1,5.1]){const p=cyl(0.055,0.055,2.6,mat(C.net));p.position.set(0,1.3,z);net.add(p);}
const band=box(0.03,0.07,9.9,basic('#ffffff'));band.position.set(0,2.2,0);net.add(band);
const band2=box(0.02,0.05,9.9,basic('#ffffff'));band2.position.set(0,1.27,0);net.add(band2);
(function(){const pts=[];for(let z=-4.95;z<=4.95;z+=0.22){pts.push(0,1.27,z,0,2.2,z);}
  for(let y=1.27;y<=2.2;y+=0.155){pts.push(0,y,-4.95,0,y,4.95);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));
  net.add(new THREE.LineSegments(g,new THREE.LineBasicMaterial({color:C.net,transparent:true,opacity:.55})));})();
for(const z of [-4.5,4.5])for(let i=0;i<8;i++){const a=cyl(0.012,0.012,0.1,basic(i%2?'#ffffff':'#E4473B'),6);a.position.set(0,2.29+i*0.1,z);net.add(a);}

/* ---------- Capas de suelo ---------- */
const zoneGroup=[];
const ZN=[[1,-7.5,3],[6,-7.5,0],[5,-7.5,-3],[4,-1.5,-3],[3,-1.5,0],[2,-1.5,3]];
for(const [n,x,z] of ZN){zoneGroup.push(floorText(String(n),x,z,1.3,1.3,200,.42));zoneGroup.push(floorText(String(n),-x,-z,1.3,1.3,200,.42));}
floorText('COURT A',-5,6.3,3.2,0.8,90,.85,512,128);
floorText('COURT B',5,-6.3,3.2,0.8,90,.85,512,128);
floorText('WAITING',-11.2,1.2,2.2,0.55,90,.75,512,128);
floorText('WAITING',11.2,-1.2,2.2,0.55,90,.75,512,128);

/* ---------- Figuras ---------- */
const L1=0.44,L2=0.465;
function makeFigure(jersey,{ponytail=true}={}){
  const root=new THREE.Group();const hips=new THREE.Group();root.add(hips);
  const mSkin=mat(C.skin),mJ=mat(jersey),mS=mat(C.shorts),mW=mat('#ffffff');
  const legs=[];
  for(const s of [1,-1]){
    const thigh=new THREE.Group();thigh.position.set(s*0.1,0,0);hips.add(thigh);
    const tm=cyl(0.078,0.066,L1,mSkin);tm.position.y=-L1/2;thigh.add(tm);
    const shin=new THREE.Group();shin.position.y=-L1;thigh.add(shin);
    const sm=cyl(0.064,0.05,L2-0.04,mSkin);sm.position.y=-(L2-0.04)/2;shin.add(sm);
    const pad=cyl(0.082,0.08,0.13,mW);pad.position.y=-0.03;shin.add(pad);
    const sock=cyl(0.056,0.056,0.15,mW);sock.position.y=-L2+0.12;shin.add(sock);
    const shoe=box(0.11,0.075,0.24,mat(C.shoe));shoe.position.set(0,-L2+0.035,0.05);shin.add(shoe);
    legs.push({thigh,shin});
  }
  const shorts=cyl(0.175,0.195,0.21,mS);shorts.position.y=-0.04;hips.add(shorts);
  const torso=new THREE.Group();hips.add(torso);
  const body=cyl(0.15,0.172,0.56,mJ);body.position.y=0.3;torso.add(body);
  const neck=cyl(0.05,0.05,0.09,mSkin);neck.position.y=0.62;torso.add(neck);
  const headG=new THREE.Group();headG.position.y=0.65;headG.rotation.order='YXZ';torso.add(headG);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.122,18,14),mSkin);head.position.y=0.12;headG.add(head);
  const hair=new THREE.Mesh(new THREE.SphereGeometry(0.13,18,12,0,Math.PI*2,0,Math.PI*0.55),mat(C.hair));
  hair.position.set(0,0.135,-0.012);hair.rotation.x=-0.45;headG.add(hair);
  if(ponytail){const pt=new THREE.Mesh(new THREE.SphereGeometry(0.06,10,8),mat(C.hair));pt.scale.set(0.8,1.5,0.8);pt.position.set(0,0.09,-0.16);pt.rotation.x=0.5;headG.add(pt);}
  const arms=[];
  for(const s of [1,-1]){
    const sh=new THREE.Group();sh.position.set(s*0.205,0.54,0);torso.add(sh);
    const sl=cyl(0.066,0.062,0.15,mJ);sl.position.y=-0.05;sh.add(sl);
    const up=cyl(0.05,0.045,0.3,mSkin);up.position.y=-0.15;sh.add(up);
    const elbow=new THREE.Group();elbow.position.y=-0.3;sh.add(elbow);
    const fj=new THREE.Mesh(new THREE.SphereGeometry(0.045,10,8),mSkin);elbow.add(fj);
    const fore=cyl(0.044,0.036,0.28,mSkin);fore.position.y=-0.14;elbow.add(fore);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(0.047,10,8),mSkin);hand.scale.set(1,1.15,0.75);hand.position.y=-0.31;elbow.add(hand);
    arms.push({sh,elbow});
  }
  const shadow=new THREE.Mesh(new THREE.CircleGeometry(0.36,24),basic('#0b1a2a',0.2));
  shadow.rotation.x=-Math.PI/2;shadow.position.y=0.006;
  return {root,hips,torso,headG,legs,arms,shadow,ang:0};
}
/* Pose: c=flexión de piernas, lean=inclinación de tronco, tw=giro de tronco, st=apertura de piernas, lk=mirada arriba
   brazo izquierdo/derecho: f=flexión de hombro, a=apertura, e=flexión de codo */
const pose=(o,L,Rr)=>Object.assign({c:.1,lean:0,tw:0,st:.08,lk:0,lf:L[0],la:L[1],le:L[2],rf:(Rr||L)[0],ra:(Rr||L)[1],re:(Rr||L)[2]},o);
const POSES={
  stand:    pose({c:.08,lean:.03,st:.07},[.12,.1,.3]),
  ready:    pose({c:.42,lean:.34,st:.22,lk:.15},[.85,.2,1.1]),
  tipLoad:  pose({c:.2,lean:-.05,st:.12,lk:.5},[1.1,.3,1.0],[2.55,.2,1.25]),
  tip:      pose({c:.04,lean:.06,st:.1,lk:.45},[.8,.3,.9],[2.95,.08,.3]),
  throwLoad:pose({c:.22,lean:-.22,st:.18,lk:.35},[3.0,.2,1.35]),
  throwOut: pose({c:.28,lean:.4,st:.18,lk:.05},[1.25,.1,.15]),
  split:    pose({c:.28,lean:.3,st:.26,lk:.15},[.85,.26,1.1]),
  dig:      pose({c:.88,lean:.56,st:.36,lk:.25},[1.42,-.3,0]),
  digFollow:pose({c:.62,lean:.42,st:.34,lk:.3},[1.62,-.3,0]),
  setLoad:  pose({c:.38,lean:-.08,st:.16,lk:.5},[2.5,.55,1.7]),
  setBackLoad:pose({c:.4,lean:-.05,st:.16,lk:.6},[2.6,.55,1.75]),
  setBack:  pose({c:.06,lean:-.32,st:.14,lk:.75},[3.3,.3,.25]),
  setPush:  pose({c:.05,lean:-.12,st:.14,lk:.45},[2.95,.35,.3]),
  approach: pose({c:.62,lean:.55,st:.12,lk:.35},[-1.05,.15,.25]),
  takeoff:  pose({c:.25,lean:.15,st:.1,lk:.45},[2.3,.1,.3]),
  load:     pose({c:.05,lean:-.22,tw:-.55,st:.08,lk:.55},[2.75,.15,.15],[2.2,.75,2.0]),
  hit:      pose({c:0,lean:.3,tw:.3,st:.08,lk:.4},[.7,.3,1.0],[2.95,.1,.05]),
  follow:   pose({c:.1,lean:.45,tw:.4,st:.1,lk:.1},[.5,.25,.9],[.9,-.15,.3]),
  land:     pose({c:.66,lean:.42,st:.24,lk:.2},[.75,.3,.8]),
  jog:      pose({c:.14,lean:.2,st:.06},[.3,.12,1.4]),
  toss:     pose({c:.1,lean:0,st:.14,lk:.5},[2.7,.1,.1],[.4,.3,.6]),
  cload:    pose({c:.12,lean:-.12,tw:-.5,st:.16,lk:.5},[2.5,.15,.2],[2.2,.75,2.0]),
  chit:     pose({c:.05,lean:.25,tw:.25,st:.16,lk:.35},[.7,.3,1.0],[2.85,.1,.05]),
  cfollow:  pose({c:.12,lean:.35,tw:.35,st:.16},[.5,.25,.9],[.9,-.15,.3])
};
/* sh=1: short adjusting steps (shuffle) instead of a running stride; tm drives the small idle motion */
function applyPose(f,p,jy,phase,amp,sh=0,tm=0){
  const a=p.c*1.1,b=p.c*2.0;
  const h=(L1*Math.cos(a)+L2*Math.cos(b-a))*Math.cos(p.st);
  const still=jy<0.02&&!reduceMotion?1-amp:0;
  const idle=still*(0.005*Math.sin(tm*1.8)+(p.c>.3?0.011*Math.abs(Math.sin(tm*2.6)):0));
  f.hips.position.y=h+0.03+jy+idle+(jy<0.02?amp*0.022*Math.abs(Math.sin(phase)):0);
  f.hips.position.z=-p.lean*p.c*0.18;
  const air=Math.min(1,jy*1.6);
  f.legs.forEach((l,i)=>{
    const sw=(i?1:-1)*Math.sin(phase)*0.6*amp*(1-0.65*sh);
    const kb=amp*0.7*Math.max(0,Math.sin(phase+(i?Math.PI:0)+1.2))*(1-0.5*sh);
    const lat=sh*amp*0.26*Math.max(0,Math.sin(phase+(i?Math.PI:0)));
    l.thigh.rotation.x=-(a+sw)+air*0.18;

/* ---------- Datos del ejercicio (coordenadas del campo A; B es espejo) ---------- */
const S=(s,p)=>s?{x:-p.x,y:p.y,z:-p.z}:{x:p.x,y:p.y,z:p.z};
// base position of each zone (where the players stand before the other side sets)
const ZP0={'1':{x:-7.0,z:3.2},'2':{x:-3.4,z:3.3},'4':{x:-3.4,z:-3.3},'5':{x:-7.0,z:-3.2},'6':{x:-7.6,z:0.2}};

const FORM={
  '4:diag':{'4':{x:-4.3,z:-2.6},'5':{x:-7.0,z:-3.2},'6':{x:-7.4,z:-1.6},'1':{x:-5.2,z:3.3}},
  '4:line':{'1':{x:-6.8,z:3.6},'6':{x:-7.4,z:1.6},'4':{x:-3.2,z:-0.1},'5':{x:-7.0,z:-3.2}},
  '2:diag':{'2':{x:-4.3,z:2.6},'1':{x:-7.0,z:3.2},'6':{x:-7.4,z:1.6},'5':{x:-5.2,z:-3.3}},
  '2:line':{'5':{x:-6.8,z:-3.6},'6':{x:-7.4,z:-1.6},'2':{x:-3.2,z:0.1},'1':{x:-7.0,z:3.2}}
};
let ZP={...ZP0,...FORM['4:diag']};
const setFormation=()=>{ZP={...ZP0,...FORM[MODE+':'+DIR]};};
const R23={x:-1.2,z:1.6}, SP={x:-0.6,z:0.7}, SETB={x:-0.6,y:2.15,z:0.45};
// configuración por zona de ataque: recorrido espera → entry → mid → atk
const MODES={
  '4':{atk:'4',mid:'6',entry:'1',OPEN:{x:-4.5,z:-4.1},JUMP:{x:-1.8,z:-3.05},AIR:{x:-1.5,z:-3.05},LAND:{x:-1.25,z:-3.05},
       HITB:{x:-1.2,y:2.72,z:-2.85},W:[{x:-1.0,z:-5.9},{x:1.0,z:-5.9},{x:9.4,z:-5.9}],
       sets:{diag:['4','5','6'],line:['1','6']}},
  '2':{atk:'2',mid:'1',entry:'6',OPEN:{x:-4.5,z:4.1},JUMP:{x:-1.8,z:3.05},AIR:{x:-1.5,z:3.05},LAND:{x:-1.25,z:3.05},
       HITB:{x:-1.2,y:2.72,z:2.85},W:[{x:-1.0,z:5.9},{x:1.0,z:5.9},{x:9.4,z:5.9}],
       sets:{diag:['1','2','6'],line:['5','6']}}
};
const DIRN={diag:'Cross-court',line:'Down-the-line'};
let MODE='4',DIR='diag';
const slot=i=>({x:-10.25-0.8*i,z:0});
const COACH={x:4.6,z:6.4}, COACH_HAND={x:4.45,y:1.2,z:6.2}, COACH_HIT={x:4.35,y:2.3,z:6.05};
const COACH_FACE=Math.atan2(-1,-0.55);
const N=16, PER=3.15, T0=2.2;
const SIDE=['A','B'];
const name=id=>id[0]==='r'?'#'+id.slice(1):id[0]==='L'?'the libero':id[0]==='S'?'the setter':'the coach';

let tracks,ballSegs,events,TOTAL;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const d2=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);

function build(seed){
  const R=rng(seed),M=MODES[MODE],set=M.sets[DIR];
  tracks={};ballSegs=[];events=[];
  const key=(id,t,p,pose,o={})=>{(tracks[id]||(tracks[id]=[])).push({t,x:p.x,z:p.z,y:o.y||0,pose,walk:!!o.walk,face:o.face,j:o.j});};
  // quién defiende en cada intercambio (sin repetir zona seguida)
  const roles=[];
  while(roles.length<N){let z=set[Math.floor(R()*set.length)];if(roles.length&&z===roles[roles.length-1])z=set[(set.indexOf(z)+1)%set.length];roles.push(z);}
  const digPos=roles.map(r=>{const b=ZP[r],m=(r==='4'||r==='2')?.4:.7;return{x:b.x+(R()-.5)*m,z:b.z+(R()-.5)*m*1.6};});
  const digBall=[];
  for(let k=0;k<N;k++){
    const s=k%2,p=S(s,digPos[k]);
    const o=k===0?COACH_HIT:S(1-s,M.HITB);
    const dx=o.x-p.x,dz=o.z-p.z,l=Math.hypot(dx,dz);
    digBall.push({x:p.x+dx/l*0.74,y:0.62,z:p.z+dz/l*0.74});
  }
  // en pista: atk (zona de ataque), mid, entry; q = fila de espera
  const st=[{atk:'r1',mid:'r2',entry:'r3',q:[{id:'r4',arr:0}]},{atk:'r5',mid:'r6',entry:'r7',q:[{id:'r8',arr:0}]}];
  const qLog=[[],[]];
  for(const s of [0,1]){
    key(st[s].atk,0,S(s,ZP0[M.atk]),'ready');key(st[s].mid,0,S(s,ZP0[M.mid]),'ready');key(st[s].entry,0,S(s,ZP0[M.entry]),'ready');
    key('S'+s,0,S(s,R23),'ready');key('L'+s,0,S(s,ZP0['5']),'ready');
  }
  // entrenador
  key('C',0,COACH,'stand',{face:COACH_FACE});key('C',0.5,COACH,'stand',{face:COACH_FACE});
  key('C',0.75,COACH,'toss',{face:COACH_FACE});key('C',1.02,COACH,'cload',{face:COACH_FACE});
  key('C',1.2,COACH,'chit',{face:COACH_FACE});key('C',1.42,COACH,'cfollow',{face:COACH_FACE});
  key('C',1.9,COACH,'stand',{face:COACH_FACE});
  ballSegs.push({t0:0.72,t1:1.2,p0:COACH_HAND,p1:COACH_HIT,h:0.45});
  ballSegs.push({t0:1.2,t1:T0,p0:COACH_HIT,p1:digBall[0],h:1.4});
  events.push({t:1.2,kind:'coach',actor:'C',main:'The coach attacks onto court A',sub:'From outside court B. Only to start the rally.'});

  for(let k=0;k<N;k++){
    const s=k%2,o=1-s,X=st[s];
    const T=T0+k*PER,tSet=T+1.15,tHit=T+2.2,Tn=T+PER;
    const r=roles[k];
    const who={[M.atk]:X.atk,[M.mid]:X.mid,[M.entry]:X.entry,'5':'L'+s};
    const def=who[r];
    const base=S(s,ZP[r]),dp=S(s,digPos[k]);
    // base position → defensive position: the players move when the other side sets (the first time, when the coach tosses)
    const tSh=k===0?0.3:T-2.0;
    for(const z in who){
      const id=who[z],b0=S(s,ZP0[z]),f=S(s,ZP[z]),dd=d2(b0,f);
      if(dd>0.05){key(id,tSh,b0,'ready');key(id,tSh+Math.min(1.05,Math.max(0.5,dd/3)),f,'ready');}
      // and back to the base position while their own setter sets (the attacker goes to her approach instead)
      if(id!==X.atk){if(id!==def)key(id,T+0.5,f,'ready');key(id,T+1.6,b0,'ready');}
    }
    // defensa: espera → paso de ajuste → plataforma → acompañar
    key(def,T-0.8,base,'ready');key(def,T-0.48,base,'split',{y:0.07});key(def,T-0.36,base,'ready');
    key(def,T-0.1,dp,'dig');key(def,T+0.02,dp,'dig');key(def,T+0.22,dp,'digFollow');key(def,T+0.6,dp,'ready');
    events.push({t:T,kind:'dig',actor:def,main:`${name(def)} digs at zone ${r}`,sub:`Court ${SIDE[s]} · the ball goes to the setter`});
    // armadora: siempre mirando a 4; con ataque por 2 coloca de espaldas
    const sid='S'+s,faceSet=(s?0:Math.PI),back=MODE==='2';
    key(sid,T-0.2,S(s,R23),'ready');key(sid,tSet-0.4,S(s,SP),'ready');
    key(sid,tSet-0.22,S(s,SP),back?'setBackLoad':'setLoad',{face:faceSet});key(sid,tSet-0.04,S(s,SP),back?'setBackLoad':'setLoad',{face:faceSet});
    key(sid,tSet+0.12,S(s,SP),back?'setBack':'setPush',{face:faceSet});key(sid,tSet+0.3,S(s,SP),back?'setBack':'setPush',{face:faceSet});
    key(sid,tSet+0.65,S(s,SP),'ready');key(sid,tHit+1.3,S(s,R23),'ready');
    events.push({t:tSet,kind:'set',actor:sid,main:`The setter sets to zone ${M.atk}`,
      sub:`Court ${SIDE[s]} · ${back?'back to the target':'facing the target'} · for ${name(X.atk)}${k<N-1?` · court ${SIDE[o]} moves from base to defence`:''}`});
    // atacante
    const A=X.atk;
    if(r!==M.atk)key(A,T-0.1,S(s,ZP[M.atk]),'ready');
    // she leaves her defensive spot as soon as the ball is up and opens out for the approach
    key(A,r===M.atk?T+0.64:T+0.2,r===M.atk?dp:S(s,ZP[M.atk]),'ready');
    key(A,T+1.25,S(s,M.OPEN),'ready');key(A,tHit-0.9,S(s,M.OPEN),'ready');
    const mid={x:M.OPEN.x+(M.JUMP.x-M.OPEN.x)*0.45,z:M.OPEN.z+(M.JUMP.z-M.OPEN.z)*0.45};
    key(A,tHit-0.62,S(s,mid),'jog');
    const j={t0:tHit-0.3,t1:tHit+0.4,h:0.62};
    key(A,tHit-0.36,S(s,M.JUMP),'approach');key(A,tHit-0.3,S(s,M.JUMP),'approach',{j});
    key(A,tHit-0.2,S(s,{x:(M.JUMP.x+M.AIR.x)/2,z:M.JUMP.z}),'takeoff',{y:0.3,j});
    key(A,tHit-0.07,S(s,M.AIR),'load',{y:0.53,j});
    key(A,tHit,S(s,M.AIR),'hit',{y:0.59,j});
    key(A,tHit+0.17,S(s,M.AIR),'follow',{y:0.53,j});
    key(A,tHit+0.4,S(s,M.LAND),'land',{j});key(A,tHit+0.62,S(s,M.LAND),'land');key(A,tHit+0.85,S(s,M.LAND),'stand');
    // cambio de campo por fuera de la red, por el poste de su lado
    let tt=tHit+0.8,prev=M.LAND;
    for(const w of M.W){tt+=d2(prev,w)/4.0;key(A,tt,S(s,w),'jog',{walk:true});prev=w;}
    const tJoin=tt+1.75;
    qLog[o].push({t:tJoin,type:'join',id:A});
    st[o].q.push({id:A,arr:tJoin,tW:tt,wEnd:prev});st[o].q.sort((a,b)=>a.arr-b.arr);
    // rotación: mid → atk, entry → mid, primera de la espera → entry
    const Q=X.q.shift();

      // la espera está vacía: la que viene del otro campo entra directa a su zona sin pararse en la fila
      const i=qLog[s].findIndex(e=>e.type==='join'&&e.id===Q.id);if(i>=0)qLog[s].splice(i,1);
      const from=S(o,Q.wEnd),to=S(s,ZP0[M.entry]);
      key(Q.id,Math.max(Q.tW+d2(from,to)/5.0,tHit+1.3),to,'ready',{walk:true});
    }else qLog[s].push({t:tHit+0.1,type:'leave',id:Q.id});
    key(X.mid,tHit+0.1,S(s,ZP0[M.mid]),'ready');key(X.mid,tHit+1.5,S(s,ZP0[M.atk]),'ready');
    key(X.entry,tHit+0.1,S(s,ZP0[M.entry]),'ready');key(X.entry,tHit+1.5,S(s,ZP0[M.mid]),'ready');
    const last=k===N-1;
    events.push({t:tHit,kind:'hit',actor:A,main:`${DIRN[DIR]} attack by ${name(A)} from ${M.atk}`,
      sub:`Next: ${name(A)} → waiting line ${SIDE[o]} · ${name(X.mid)} moves to ${M.atk} · ${name(X.entry)} moves to ${M.mid} · ${name(Q.id)} comes in at ${M.entry}`});
    X.atk=X.mid;X.mid=X.entry;X.entry=Q.id;
    // balón
    const setB=S(s,SETB),hitB=S(s,M.HITB);

    ballSegs.push({t0:tSet,t1:tHit,p0:setB,p1:hitB,h:1.5});
    if(!last)ballSegs.push({t0:tHit,t1:Tn,p0:hitB,p1:digBall[k+1],h:1.35});
    else{const z=ZP[set[0]],land=S(o,{x:z.x+0.8,y:0.11,z:z.z*0.7});ballSegs.push({t0:tHit,t1:tHit+0.95,p0:hitB,p1:land,h:1.3});
      TOTAL=tHit+3.2;events.push({t:tHit+0.95,kind:'end',actor:null,main:'End of the sample sequence',sub:'It starts again from the beginning.'});}
  }
  // segunda pasada: filas de espera
  const init=[['r4'],['r8']];
  for(const s of [0,1]){
    const list=init[s].slice();list.forEach((id,i)=>key(id,0,S(s,slot(i)),'stand'));
    qLog[s].sort((a,b)=>a.t-b.t);

      if(e.type==='join'){list.push(e.id);key(e.id,e.t,S(s,slot(list.length-1)),'stand',{walk:true});}
      else{
        const id=list.shift();
        key(id,e.t,S(s,slot(0)),'stand');key(id,e.t+1.25,S(s,ZP0[M.entry]),'ready');
        list.forEach((m,i)=>{key(m,e.t+0.15,S(s,slot(i+1)),'stand');key(m,e.t+0.9,S(s,slot(i)),'stand');});
      }
    }
  }

  events.sort((a,b)=>a.t-b.t);
  renderPanel();
  buildTicks();
}

/* ---------- Variants ---------- */
const VARS=[['4','diag','From 4 · cross-court'],['4','line','From 4 · down the line'],['2','diag','From 2 · cross-court'],['2','line','From 2 · down the line']];
function renderPanel(){const M=MODES[MODE];if($('metaMode'))$('metaMode').textContent=`Attack from ${M.atk} · ${DIRN[DIR].toLowerCase()}`;}
/* ---------- Muestreo ---------- */
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function sample(tr,t){
  if(t<=tr[0].t){const k=tr[0];return{x:k.x,z:k.z,y:k.y,pose:POSES[k.pose],pose1:POSES[k.pose],u:0,speed:0,d:k.d,dx:0,dz:0,face:k.face};}
  let i=0;while(i<tr.length-1&&tr[i+1].t<=t)i++;
  const k0=tr[i];
  if(i===tr.length-1)return{x:k0.x,z:k0.z,y:k0.y,pose:POSES[k0.pose],pose1:POSES[k0.pose],u:0,speed:0,d:k0.d,dx:0,dz:0,face:k0.face};
  const k1=tr[i+1],dur=k1.t-k0.t,u=(t-k0.t)/dur,ue=ease(u),air=k0.j&&k0.j===k1.j;
  // runs speed up at the start and slow down at the end; a jump follows a parabola
  let ul=ue;
  if(air)ul=u;
  else if(k1.walk){const s1=Math.sin(Math.PI*u)/Math.PI;
    ul=k1.e0&&k1.e1?u-0.55*Math.sin(2*Math.PI*u)/(2*Math.PI):k1.e0?u-0.4*s1:k1.e1?u+0.4*s1:u;}
  const dist=d2(k0,k1);
  let y=k0.y+(k1.y-k0.y)*ue;
  if(air){const q=Math.min(1,Math.max(0,(t-k0.j.t0)/(k0.j.t1-k0.j.t0)));y=4*k0.j.h*q*(1-q);}
  return{x:k0.x+(k1.x-k0.x)*ul,z:k0.z+(k1.z-k0.z)*ul,y,pose:POSES[k0.pose],pose1:POSES[k1.pose],u:ue,
    speed:dist/dur,d:k0.d+dist*ul,dx:k1.x-k0.x,dz:k1.z-k0.z,face:k1.face!=null?k1.face:k0.face,
    shuf:k1.sh||(!k1.walk&&dist<2.6)};
}
function markRuns(tr){tr.forEach((k,i)=>{if(k.walk){k.e0=!(tr[i-1]&&tr[i-1].walk);k.e1=!(tr[i+1]&&tr[i+1].walk);}});}
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const wrapA=a=>((a+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI;
const busy=(id,t)=>events.some(e=>e.actor===id&&e.t>t-1.2&&e.t<t+3);
const lerpPose=(a,b,u)=>{const o={};for(const k in a)o[k]=a[k]+(b[k]-a[k])*u;return o;};
function ballAt(t){
  if(t<=ballSegs[0].t0)return{p:ballSegs[0].p0,seg:null};
  for(const g of ballSegs){if(t>=g.t0&&t<=g.t1){const u=(t-g.t0)/(g.t1-g.t0);return{p:arc(g,u),seg:g,u};}}
  let last=null;for(const g of ballSegs)if(g.t1<=t)last=g;
  return{p:last?last.p1:ballSegs[0].p0,seg:null};
}
function arc(g,u){return{x:g.p0.x+(g.p1.x-g.p0.x)*u,y:g.p0.y+(g.p1.y-g.p0.y)*u+4*g.h*u*(1-u),z:g.p0.z+(g.p1.z-g.p0.z)*u};}

/* ---------- Actualizar escena ---------- */
let showTrail=true;
function update(t,dt,snap){
  const b=ballAt(t);
  ball.position.set(b.p.x,b.p.y,b.p.z);
  if(b.seg&&!reduceMotion&&dt>0){ // spin: topspin on hard-driven balls, light backspin on passes and sets
    const g=b.seg,sx=g.p1.x-g.p0.x,sz=g.p1.z-g.p0.z,sl=Math.hypot(sx,sz);
    if(sl>0.05){const v=sl/(g.t1-g.t0);spinAxis.set(sz/sl,0,-sx/sl);ball.rotateOnWorldAxis(spinAxis,dt*(v>8?16:-4));}
  }
  ballShadow.position.set(b.p.x,0.007,b.p.z);
  const hs=Math.max(0.35,1-b.p.y*0.18);ballShadow.scale.setScalar(hs);ballShadow.material.opacity=0.25*hs;
  // trayectoria
  const tp=trailGeo.attributes.position.array,ap=aheadGeo.attributes.position.array;
  if(b.seg&&showTrail){
    for(let i=0;i<TRAIL_N;i++){const p=arc(b.seg,b.u*i/(TRAIL_N-1));tp[i*3]=p.x;tp[i*3+1]=p.y;tp[i*3+2]=p.z;
      const q=arc(b.seg,b.u+(1-b.u)*i/(TRAIL_N-1));ap[i*3]=q.x;ap[i*3+1]=q.y;ap[i*3+2]=q.z;}
    trailGeo.attributes.position.needsUpdate=true;aheadGeo.attributes.position.needsUpdate=true;
    trailGeo.computeBoundingSphere();aheadGeo.computeBoundingSphere();ahead.computeLineDistances();
    trail.visible=ahead.visible=true;
  }else trail.visible=ahead.visible=false;
  for(const id in actors){
    const f=actors[id],tr=tracks[id];if(!tr)continue;
    const s=sample(tr,t);
    f.root.position.set(s.x,0,s.z);f.shadow.position.set(s.x,0.006,s.z);
    const moving=s.speed>1.0&&s.y<0.05,shuf=moving&&s.shuf;
    const bdx=b.p.x-s.x,bdz=b.p.z-s.z,bd=Math.hypot(bdx,bdz),live=bd<22;
    let target;
    if(s.face!=null)target=s.face;
    else if(moving&&!shuf)target=Math.atan2(s.dx,s.dz);
    else if(live)target=Math.atan2(bdx,bdz);
    else target=f.ang;
    let diff=wrapA(target-f.ang);
    f.ang=snap?target:f.ang+diff*Math.min(1,dt*9);
    f.root.rotation.y=f.ang;
    const amp=s.y<0.05?Math.min(1,Math.max(0,(s.speed-0.3)/2.6)):0;
    // players waiting outside the court stand relaxed until their turn comes
    const rest=s.pose===POSES.ready&&s.pose1===POSES.ready&&(Math.abs(s.x)>9.3||Math.abs(s.z)>4.8)&&!busy(id,t)?1:0;
    f.rx=snap?rest:f.rx+(rest-f.rx)*Math.min(1,dt*4);
    let p=lerpPose(s.pose,s.pose1,s.u);
    if(f.rx>0.01)p=lerpPose(p,POSES.stand,f.rx);
    if(amp>0&&!shuf)p.lean+=0.12*amp;
    applyPose(f,p,s.y,s.d*2*Math.PI/(shuf?0.9:1.5),amp,shuf?1:0,t+f.seed);
    // the head follows the ball
    let hy=0,hx=f.headG.rotation.x;
    if(live&&bd>0.3){const yaw=wrapA(Math.atan2(bdx,bdz)-f.ang-p.tw);
      if(Math.abs(yaw)<2.5){hy=clamp(yaw,-1.1,1.1);
        hx=-clamp(Math.atan2(b.p.y-(f.hips.position.y+0.75),bd)+p.lean*0.6,-0.3,1.0);}}
    const hk=snap?1:Math.min(1,dt*10);
    f.hy+=(hy-f.hy)*hk;f.hx+=(hx-f.hx)*hk;
    f.headG.rotation.set(f.hx,f.hy,0);
    f.tag.position.set(s.x,f.hips.position.y+1.35,s.z);
  }
  // anillo bajo la jugadora que actúa
  let ev=null;for(const e of events){if(e.t<=t+0.2&&t-e.t<1.0&&e.actor)ev=e;}
  if(ev){const a=sample(tracks[ev.actor],t);ring.visible=true;ring.position.set(a.x,0.012,a.z);
    ring.material.color.set(ev.kind==='hit'?'#ffffff':ev.kind==='set'?'#FFE0D6':'#ffffff');
    ring.material.opacity=0.9*Math.max(0,1-Math.max(0,t-ev.t)/1.0);}
  else ring.visible=false;
}

/* ---------- Cámaras ---------- */
const CAMS={iso:{p:[-18,21,26]},lat:{p:[0,10,40]},top:{p:[0,45,0.02]},back:{p:[-40,11,0]}};
let camTween=null;
function setCam(name,instant){
  const to=new THREE.Vector3(...CAMS[name].p);
  document.querySelectorAll('[data-cam]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.cam===name));
  if(instant||reduceMotion){cam.position.copy(to);cam.zoom=1;controls.target.set(0,0.6,0);cam.updateProjectionMatrix();return;}
  camTween={from:cam.position.clone(),to,z0:cam.zoom,t0:controls.target.clone(),k:0};
}
function resize(){
  const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);
  const a=w/h,halfH=Math.max(8,15/a);
  cam.left=-halfH*a;cam.right=halfH*a;cam.top=halfH;cam.bottom=-halfH;cam.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(stage);

/* ---------- Interfaz ---------- */
let t=0,playing=true,speed=1,lastNow=performance.now(),seed=7,lastEvIdx=-2;
const scrub=$('scrub')||{value:0,max:0,addEventListener(){}};
function buildTicks(){
  scrub.max=TOTAL.toFixed(2);
  if(!$('ticks'))return;
  const col={coach:'var(--ink)',dig:'var(--sky)',set:'var(--red)',hit:'var(--court)',end:'var(--muted)'};
  $('ticks').innerHTML=events.map(e=>`<i style="left:${(e.t/TOTAL*100).toFixed(2)}%;background:${col[e.kind]}"></i>`).join('');
}
function setPlaying(p){playing=p;$('play').setAttribute('aria-label',p?'Pause':'Play');
  $('playIcon').innerHTML=p?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M7 4v16l13-8z"/>';}
function seek(nt){t=Math.max(0,Math.min(TOTAL,nt));update(t,0,true);}
$('play').onclick=()=>{if(t>=TOTAL-0.01)t=0;setPlaying(!playing);};
$('next').onclick=()=>{const e=events.find(e=>e.t>t+0.02);setPlaying(false);seek(e?e.t:TOTAL);};
$('prev').onclick=()=>{let e=null;for(const x of events)if(x.t<t-0.05)e=x;setPlaying(false);seek(e?e.t:0);};
scrub.addEventListener('input',()=>{setPlaying(false);seek(parseFloat(scrub.value));});
document.querySelectorAll('[data-speed]').forEach(b=>b.onclick=()=>{speed=parseFloat(b.dataset.speed);
  document.querySelectorAll('[data-speed]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>setCam(b.dataset.cam));
document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);
  if(b.dataset.tog==='zones')zoneGroup.forEach(m=>m.visible=on);
  if(b.dataset.tog==='trail')showTrail=on;
  if(b.dataset.tog==='tags')for(const id in actors)actors[id].tag.visible=on;});
function restart(){setFormation();build(seed);lastEvIdx=-2;seek(0);setPlaying(true);}
$('vars').innerHTML=VARS.map(v=>`<button class="chip" data-var="${v[0]}:${v[1]}" aria-pressed="${v[0]===MODE&&v[1]===DIR}">${v[2]}</button>`).join('');
document.querySelectorAll('[data-var]').forEach(b=>b.onclick=()=>{[MODE,DIR]=b.dataset.var.split(':');setFormation();
  document.querySelectorAll('[data-var]').forEach(x=>x.setAttribute('aria-pressed',x===b));restart();});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();$('play').click();}
  else if(e.code==='ArrowRight'){e.preventDefault();$('next').click();}
  else if(e.code==='ArrowLeft'){e.preventDefault();$('prev').click();}
});
function updateCaption(){
  let idx=-1;events.forEach((e,i)=>{if(e.t<=t+0.001)idx=i;});
  if(idx===lastEvIdx)return;lastEvIdx=idx;
  if(idx<0){$('capStep').textContent=`Action 0 of ${events.length}`;$('capMain').textContent='Starting positions';
    const M=MODES[MODE];$('capSub').textContent=`Setters between 2 and 3 · liberos at 5 · rotating players at ${M.entry}, ${M.mid} and ${M.atk} · 1 waiting per court`;return;}
  const e=events[idx];$('capStep').textContent=`Action ${idx+1} of ${events.length}`;
  $('capMain').textContent=e.main;$('capSub').textContent=e.sub||'';
}

function loop(now){
  const dt=Math.min(0.05,(now-lastNow)/1000);lastNow=now;
  if(playing){t+=dt*speed;if(t>TOTAL){t=0;update(t,0,true);}}
  if(camTween){camTween.k=Math.min(1,camTween.k+dt/0.75);const u=ease(camTween.k);
    cam.position.lerpVectors(camTween.from,camTween.to,u);cam.zoom=camTween.z0+(1-camTween.z0)*u;
    controls.target.lerpVectors(camTween.t0,new THREE.Vector3(0,0.6,0),u);cam.updateProjectionMatrix();if(camTween.k>=1)camTween=null;}
  update(t,dt,false);
  controls.update();
  scrub.value=t.toFixed(2);
  $('time').textContent=`${t.toFixed(1)} s / ${TOTAL.toFixed(0)} s`;
  updateCaption();
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}

function start(){
  for(let i=1;i<=8;i++)addActor('r'+i,C.pale,String(i),'#2D7DB2','#ffffff');
  addActor('S0',C.red,'A',C.red,'#ffffff');addActor('S1',C.red,'A',C.red,'#ffffff');
  addActor('L0',C.gold,'L',C.gold,'#1C232C');addActor('L1',C.gold,'L',C.gold,'#1C232C');
  addActor('C',C.coach,'E',C.coach,'#ffffff',{ponytail:false});
  // carro de balones junto al entrenador
  const cart=box(0.6,0.55,0.6,mat('#5B6773'));cart.position.set(5.5,0.275,6.6);scene.add(cart);
  for(let i=0;i<5;i++){const bb=new THREE.Mesh(new THREE.SphereGeometry(0.11,14,10),new THREE.MeshStandardMaterial({map:ballTex}));
    bb.position.set(5.35+(i%3)*0.15,0.62+Math.floor(i/3)*0.12,6.5+(i%2)*0.18);scene.add(bb);}
  build(seed);resize();setCam('iso',true);update(0,0,true);
  requestAnimationFrame(n=>{lastNow=n;loop(n);});
}
const fontWait=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
fontWait.then(start);
})();
</script>
